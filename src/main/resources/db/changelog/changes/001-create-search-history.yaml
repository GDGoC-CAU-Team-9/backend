databaseChangeLog:
  - changeSet:
      id: 001-create-search-history-table
      author: gdg_team9
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - not:
            tableExists:
              tableName: search_history
      changes:
        - createTable:
            tableName: search_history
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: member_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_search_history_member
                    references: member(id)
              - column:
                  name: image_ids
                  type: json
                  constraints:
                    nullable: false
              - column:
                  name: search_result
                  type: json
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp(6)
                  defaultValueComputed: CURRENT_TIMESTAMP(6)
                  constraints:
                    nullable: false
