buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.liquibase:liquibase-core:4.31.1'
    }
}
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.liquibase.gradle' version '3.1.0'
}
ext {
    springCloudVersion = "2025.1.0"
}

group = 'com.gdg_team9'
version = '0.0.1-SNAPSHOT'
description = 'GDGoC CAU Team 9'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    liquibaseRuntime.extendsFrom runtimeClasspath
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    // Source: https://mvnrepository.com/artifact/io.awspring.cloud/spring-cloud-aws-starter-s3
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3:4.0.0'

    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-liquibase-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    liquibaseRuntime 'org.liquibase:liquibase-core:4.31.1'
    liquibaseRuntime 'org.liquibase:liquibase-groovy-dsl:4.0.1'
    liquibaseRuntime 'info.picocli:picocli:4.6.1'

    // liquibase diff: hibernate 7 - liquibase plugin 호환 문제로 인해 임시 보류
//    liquibaseRuntime 'com.mysql:mysql-connector-j'
//    liquibaseRuntime 'org.liquibase.ext:liquibase-hibernate6:4.31.1'
//    liquibaseRuntime 'org.springframework.boot:spring-boot-starter-data-jpa'
//    liquibaseRuntime sourceSets.main.output

}
dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:$springCloudVersion"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

// Load database properties from spring properties
def loadDatabaseProperties() {
    Properties props = new Properties()

    // 1단계: application.properties 읽기 (공통 설정)
    File basePropsFile = file("src/main/resources/application.properties")
    if (basePropsFile.exists()) {
        basePropsFile.withInputStream { stream ->
            props.load(stream)
        }
    }

    // 2단계: application-[profile].properties 읽기 (환경별 설정으로 덮어씀)
    String profile = project.findProperty('profile') ?: 'local'
    String propsFile = "src/main/resources/application-${profile}.properties"
    File profilePropsFile = file(propsFile)

    if (profilePropsFile.exists()) {
        profilePropsFile.withInputStream { stream ->
            props.load(stream)  // 같은 키는 덮어씀 (Spring Boot와 동일한 동작)
        }
    }

    String changelogFilePath = props.getProperty('spring.liquibase.change-log').replace('classpath:', '')
    props.setProperty('liquibase.change-log', changelogFilePath)

    return props
}

def dbProps = loadDatabaseProperties()

liquibase {
    activities {
        main {
            changelogFile dbProps.getProperty('liquibase.change-log')
            url dbProps.getProperty('spring.datasource.url')
            username dbProps.getProperty('spring.datasource.username')
            password dbProps.getProperty('spring.datasource.password')
            searchPath "${project.projectDir}/src/main/resources"
        }
    }
    runList = project.findProperty('runList') ?: 'main'
}